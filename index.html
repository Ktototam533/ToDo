<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine To-Do-App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <h1>Meine To-Do-Liste</h1>
        
        <!-- Formular für die Eingabe -->
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Neue Aufgabe hinzufügen..." required>
            <button type="submit" id="add-button">Hinzufügen</button>
        </form>

        <!-- Bereich für die Ausgabe der Aufgaben -->
        <ul id="todo-list">
            <!-- Hier landen später die dynamischen To-Dos -->
        </ul>
    </div>

    <!-- JavaScript-Datei einbinden -->
    <script src="script.js"></script>
</body>
</html>
