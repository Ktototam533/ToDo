<!DOCTYPE html>

<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Meine To-Do-App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <h1>Meine To-Do-Liste</h1>
        <button onclick="sagHallo()">Klick mich!  </button>
    
        <form id="todo-input">
            <input type="text" id="todo-input" autocomplete="off" placeholder="Neue Aufgabe hinzufügen..." required>
            <button type="submit" id="add-button">Hinzufügen</button>
        </form>

        <!-- Bereich für die Ausgabe der Aufgaben -->
        <ul id="todo-list">
            <!-- Hier landen später die dynamischen To-Dos -->
        </ul>
    </div>
    
    <script src="script.js"></script>

    <script>
    
    sagHallo();
   
    
    </script>
